name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gate
        run: ./scripts/gate.sh
      - name: Run authored audio qualification records
        run: |
          PREFIX="08-05-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          python3 -B scripts/check-audio-cases.py --build build/gate --suite qualification --run --artifact-prefix "$PREFIX"
      - name: Emit authored audio evidence
        run: |
          PREFIX="08-05-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          python3 -B scripts/qualify-audio.py --emit-hosted --job "$GITHUB_JOB" --sha "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --build build/gate --suite qualification --artifact-prefix "$PREFIX" --out "build/evidence/combined/$GITHUB_JOB/audio/$GITHUB_JOB"
      - name: Emit authored raw RDP VI evidence
        run: python3 -B scripts/qualify-rdp-vi.py --emit-hosted --job "$GITHUB_JOB" --sha "$GITHUB_SHA"
      - name: Emit guest evidence
        run: sh scripts/collect-boot-evidence.sh --emit
      - name: Rights scan sanitized output
        run: sh scripts/rights-scan.sh --staging build/evidence
      - name: PII scan sanitized output
        run: sh scripts/collect-boot-evidence.sh --scan-pii
      - name: PII scan authored raw RDP VI evidence
        run: python3 -B scripts/qualify-rdp-vi.py --scan-pii
      - name: PII scan authored audio evidence
        run: python3 -B scripts/qualify-audio.py --scan-pii --job "$GITHUB_JOB" --sha "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --out "build/evidence/combined/$GITHUB_JOB/audio/$GITHUB_JOB"
      - name: Upload sanitized authored evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: t64-authored-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: |
            build/evidence/combined/gate-linux/gate-linux.json
            build/evidence/combined/gate-linux/rdp-vi/gate-linux/manifest.json
            build/evidence/combined/gate-linux/rdp-vi/gate-linux/inventory.json
            build/evidence/combined/gate-linux/rdp-vi/gate-linux/observation.json
            build/evidence/combined/gate-linux/rdp-vi/gate-linux/raw-export.json
            build/evidence/combined/gate-linux/audio/gate-linux/manifest.json
          if-no-files-found: error

  gate-macos:
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gate
        run: ./scripts/gate.sh
      - name: Run authored audio qualification records
        run: |
          PREFIX="08-05-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          python3 -B scripts/check-audio-cases.py --build build/gate --suite qualification --run --artifact-prefix "$PREFIX"
      - name: Emit authored audio evidence
        run: |
          PREFIX="08-05-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          python3 -B scripts/qualify-audio.py --emit-hosted --job "$GITHUB_JOB" --sha "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --build build/gate --suite qualification --artifact-prefix "$PREFIX" --out "build/evidence/combined/$GITHUB_JOB/audio/$GITHUB_JOB"
      - name: Emit authored raw RDP VI evidence
        run: python3 -B scripts/qualify-rdp-vi.py --emit-hosted --job "$GITHUB_JOB" --sha "$GITHUB_SHA"
      - name: Emit guest evidence
        run: sh scripts/collect-boot-evidence.sh --emit
      - name: Rights scan sanitized output
        run: sh scripts/rights-scan.sh --staging build/evidence
      - name: PII scan sanitized output
        run: sh scripts/collect-boot-evidence.sh --scan-pii
      - name: PII scan authored raw RDP VI evidence
        run: python3 -B scripts/qualify-rdp-vi.py --scan-pii
      - name: PII scan authored audio evidence
        run: python3 -B scripts/qualify-audio.py --scan-pii --job "$GITHUB_JOB" --sha "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --out "build/evidence/combined/$GITHUB_JOB/audio/$GITHUB_JOB"
      - name: Upload sanitized authored evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: t64-authored-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: |
            build/evidence/combined/gate-macos/gate-macos.json
            build/evidence/combined/gate-macos/rdp-vi/gate-macos/manifest.json
            build/evidence/combined/gate-macos/rdp-vi/gate-macos/inventory.json
            build/evidence/combined/gate-macos/rdp-vi/gate-macos/observation.json
            build/evidence/combined/gate-macos/rdp-vi/gate-macos/raw-export.json
            build/evidence/combined/gate-macos/audio/gate-macos/manifest.json
          if-no-files-found: error
